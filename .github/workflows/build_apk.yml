name: Build Aditya Music APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Wrapper and Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate offline headset EQ database
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/AutoEq
          git clone --depth=1 --filter=blob:none --sparse https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          git -C /tmp/AutoEq sparse-checkout set results
          python3 tools/generate_headset_profiles.py \
            --autoeq-dir /tmp/AutoEq \
            --output app/src/main/assets/headset_profiles.json

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Unit tests are intentionally not a build gate here. This project contains Android-dependent
      # JVM tests that require instrumentation/Robolectric rather than a plain local JVM.

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aditya-Music-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Success Message
        run: |
          echo "=================================================="
          echo "ADITYA MUSIC APK BUILT SUCCESSFULLY!"
          echo "You can download the APK from the Artifacts section of this workflow run."
          echo "=================================================="
