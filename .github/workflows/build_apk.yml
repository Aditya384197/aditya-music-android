
name: Download Android 16 AOSP Music Source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  download-source:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip

      - name: Clone Android 16 Music
        run: |
          git clone --depth 1 --branch android16-release \
            https://android.googlesource.com/platform/packages/apps/Music.git \
            Android16-Music

      - name: Save source revision
        run: |
          cd Android16-Music
          git rev-parse HEAD > SOURCE_COMMIT.txt
          cd ..

      - name: Create source ZIP
        run: |
          zip -qr Android16-Music-Source.zip Android16-Music

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android16-Music-Source
          path: Android16-Music-Source.zip
          if-no-files-found: error
          retention-days: 30
